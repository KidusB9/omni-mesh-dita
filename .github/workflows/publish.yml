name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and publish (Windows toolkit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache the DITA-OT release zip
        uses: actions/cache@v4
        with:
          path: .tools/dita-ot-4.4.1.zip
          key: dita-ot-4.4.1

      - name: Set up DITA-OT and install plugins
        shell: cmd
        run: setup.bat

      - name: Validate and publish every deliverable
        shell: cmd
        run: build.bat

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: out/pdf/*.pdf
          if-no-files-found: error

      - name: Upload help site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/site
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
